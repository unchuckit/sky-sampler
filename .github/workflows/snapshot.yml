name: Snapshot air quality and deploy

# Takes a fresh snapshot of Udara Jakarta station data, rebuilds, and deploys.
#
# SCHEDULE CHOICE — half-hourly, matching the source's own update cadence.
# This is ~48 runs/day. On a PUBLIC repository Actions minutes are unlimited, so
# this is free. On a PRIVATE repository the free allowance is 2,000 minutes/month
# and this schedule will exceed it.
#
# If this repo must stay private, change the cron below to hourly ('7 * * * *').
# No constant needs changing to go with it any more: reading age is scored
# rather than gated at 3 hours, so the extra delay costs a borderline station a
# score penalty instead of dropping it out entirely. The hard wall is
# MAX_READING_AGE_HOURS (6h) and an hourly snapshot stays well inside it.
#
# Offset from the top of the hour on purpose — GitHub's scheduled runners are
# heavily contended at :00 and delays there are common.

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch: # manual trigger, for before a talk or rehearsal
  push:
    branches: [main]

# Only deploy from the default branch of this repo. Pull requests — including
# from forks on a public repo — never reach the deploy step and never see the
# service account secret.
concurrency:
  group: snapshot-deploy
  cancel-in-progress: false

jobs:
  snapshot-and-deploy:
    runs-on: ubuntu-latest
    # Only the canonical repo deploys. A fork that somehow triggers this has no
    # service account secret anyway, but being explicit costs nothing.
    if: github.repository == 'unchuckit/sky-sampler'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      # Fail here, loudly and first, rather than after a five-minute run.
      # `firebase init hosting:github` names the secret after the project, while
      # a hand-added one is usually the plain name — either is accepted.
      - name: Check the Firebase service account secret exists
        env:
          NAMED: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SKY_SAMPLER }}
          PLAIN: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$NAMED" ] && [ -z "$PLAIN" ]; then
            echo "::error::No Firebase service account secret found."
            echo "Add one under Settings -> Secrets and variables -> Actions, named either"
            echo "  FIREBASE_SERVICE_ACCOUNT_SKY_SAMPLER  (what 'firebase init hosting:github' creates)"
            echo "  FIREBASE_SERVICE_ACCOUNT              (if you added it by hand)"
            echo "Until then the deployed snapshot goes stale after 6 hours and the app"
            echo "correctly reports no coverage rather than serving old readings."
            exit 1
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: '22' # LTS, for the app's own build/test/snapshot steps.
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # A parse or validation failure never overwrites the good file — the script
      # exits non-zero with the previous snapshot untouched.
      #
      # This step is allowed to fail without stopping the run, but ONLY because
      # of the fallback below. Hard-failing here coupled every code change to a
      # third-party server's uptime: while udara.jakarta.go.id was returning
      # HTTP 500, no unrelated fix could reach production at all.
      - name: Snapshot Udara Jakarta
        id: snapshot
        continue-on-error: true
        run: npm run snapshot

      # Reuse what is ALREADY LIVE rather than the copy committed in the repo.
      # The committed one can easily be older than the deployed one, so building
      # from it would push production backwards — replacing a two-hour-old
      # snapshot with a two-day-old one. This guarantees a deploy never ships
      # data staler than what it is replacing.
      #
      # If this also fails there is no known-good data to ship, so the run stops
      # here and the existing deploy keeps serving.
      - name: Reuse the deployed snapshot if the source was unreachable
        if: steps.snapshot.outcome == 'failure'
        run: |
          echo "::warning::Source snapshot failed. Reusing the currently deployed snapshot so the build can proceed."
          curl -fsS --retry 3 --retry-delay 5 \
            https://sky-sampler.web.app/data/stations.json -o public/data/stations.json
          node -e "
            const s = require('./public/data/stations.json');
            if (!Array.isArray(s.stations) || s.stations.length < 20) {
              console.error('Deployed snapshot is unusable — refusing to build.');
              process.exit(1);
            }
            const ageH = (Date.now() - new Date(s.fetchedAt)) / 3600000;
            console.log('Reusing deployed snapshot from ' + s.fetchedAt + ' (' + ageH.toFixed(1) + 'h old, ' + s.stations.length + ' stations)');
            if (ageH > 6) console.log('::warning::That snapshot is over 6h old, so the app will correctly report no current reading until the source recovers.');
          "

      - name: Build
        run: npm run build

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SKY_SAMPLER || secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: sky-sampler
